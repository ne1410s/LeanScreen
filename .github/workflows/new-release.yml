name: release

on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+*
  workflow_dispatch:
    inputs:
      increment-type:
        description: "Version increment"
        required: true
        type: choice
        default: pre-release
        options:
          - major
          - minor
          - patch
          - pre-release

      skip-tests:
        description: "Skip the test workflow"
        required: false
        type: boolean
        default: false

jobs:
  call_test:
    if: ${{ inputs.skip-tests != true }}
    uses: ./.github/workflows/run-tests.yml
    secrets: inherit

  release:
    if: ${{ !cancelled() && !failure() }}
    needs: call_test
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Determine version
        id: version
        shell: bash
        run: |
          # For a tag-triggered release, the tag determines the version.
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            version="${GITHUB_REF_NAME#v}"

          # For a manual release, calculate the next version from VersionPrefix.
          else
            versions=()

            while IFS= read -r -d '' file; do
              current="$(
                sed -nE 's#.*<VersionPrefix>([^<]+)</VersionPrefix>.*#\1#p' "$file" |
                  head -n1
              )"

              if [[ -n "$current" ]]; then
                versions+=("$current")
              fi
            done < <(
              find ./source \
                -type f \
                -name '*.csproj' \
                ! -name '*.Test.csproj' \
                ! -name '*.Tests.csproj' \
                ! -name '*.UnitTest.csproj' \
                ! -name '*.UnitTests.csproj' \
                -print0
            )

            if [[ ${#versions[@]} -eq 0 ]]; then
              echo "Could not find any VersionPrefix values"
              exit 1
            fi

            current="${versions[0]}"

            # All production projects should have the same version.
            for project_version in "${versions[@]}"; do
              if [[ "$project_version" != "$current" ]]; then
                echo "Version mismatch detected!"
                echo "Expected: $current"
                echo "Found:    $project_version"
                exit 1
              fi
            done

            echo "Current version: $current"

            # Split version into:
            #   major.minor.patch[-prerelease]
            if [[ "$current" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-(.+))?$ ]]; then
              major="${BASH_REMATCH[1]}"
              minor="${BASH_REMATCH[2]}"
              patch="${BASH_REMATCH[3]}"
              prerelease="${BASH_REMATCH[5]}"
            else
              echo "Invalid version: $current"
              exit 1
            fi

            case "${{ inputs.increment-type }}" in
              major)
                version="$((major + 1)).0.0"
                ;;

              minor)
                version="$major.$((minor + 1)).0"
                ;;

              patch)
                version="$major.$minor.$((patch + 1))"
                ;;

              pre-release)
                if [[ "$prerelease" =~ ^beta\.([0-9]+)$ ]]; then
                  # 1.2.3-beta.1 -> 1.2.3-beta.2
                  version="$major.$minor.$patch-beta.$((BASH_REMATCH[1] + 1))"
                else
                  # 1.2.3 -> 1.2.4-beta.1
                  version="$major.$minor.$((patch + 1))-beta.1"
                fi
                ;;

              *)
                echo "Unknown increment type"
                exit 1
                ;;
            esac
          fi

          echo "Release version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Pack and Publish
        env:
          READ_REPO_PACKAGES: ${{ secrets.READ_REPO_PACKAGES }}
        shell: bash
        run: |
          cd ./source

          version="${{ steps.version.outputs.version }}"

          dotnet nuget add source \
            "https://nuget.pkg.github.com/ne1410s/index.json" \
            --name ne1410s \
            --username ne1410s \
            --password "${READ_REPO_PACKAGES}" \
            --store-password-in-clear-text

          dotnet pack \
            -c Release \
            -o "${{ runner.temp }}/nu" \
            -p:Version="$version"

          echo "skipping push to github feed ..."
          # dotnet nuget push \
          #   "${{ runner.temp }}/nu/*.nupkg" \
          #   --api-key "${{ secrets.GITHUB_TOKEN }}" \
          #   --source "https://nuget.pkg.github.com/ne1410s/index.json"

      - name: Update version (manual release)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"

          echo "Updating project VersionPrefix to $version"

          while IFS= read -r -d '' file; do
            sed \
              "s#<VersionPrefix>[^<]*</VersionPrefix>#<VersionPrefix>$version</VersionPrefix>#" \
              "$file" -i
          done < <(
            find ./source \
              -type f \
              -name '*.csproj' \
              ! -name '*.Test.csproj' \
              ! -name '*.Tests.csproj' \
              ! -name '*.UnitTest.csproj' \
              ! -name '*.UnitTests.csproj' \
              -print0
          )

          git config --global user.email "octocat@github.com"
          git config --global user.name "ci-bot"

          git commit \
            -am "Published ${version}: Update version [skip ci]."

          git push

      - name: Increment patch (tag release)
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"

          if [[ "$version" =~ ^([0-9]+\.[0-9]+\.)([0-9]+)$ ]]; then
            echo "$version is a stable release version. Incrementing patch."

            vnext="${BASH_REMATCH[1]}$((${BASH_REMATCH[2]} + 1))"

            while IFS= read -r -d '' file; do
              sed \
                "s#<VersionPrefix>[^<]*</VersionPrefix>#<VersionPrefix>$vnext</VersionPrefix>#" \
                "$file" -i
            done < <(
              find ./source \
                -type f \
                -name '*.csproj' \
                ! -name '*.Test.csproj' \
                ! -name '*.Tests.csproj' \
                ! -name '*.UnitTest.csproj' \
                ! -name '*.UnitTests.csproj' \
                -print0
            )

            git config --global user.email "octocat@github.com"
            git config --global user.name "ci-bot"

            git commit \
              -am "Published ${version}: Increment patch [skip ci]."

            git push
          else
            echo "Skipping patch increment. $version is not a stable release version."
          fi